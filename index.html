<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#090d16" />
    <title>Pac-Man Arcade Offline</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
  </head>
  <body>
    <main class="arcade-wrapper">
      <div id="game-toast" class="game-toast hidden" aria-live="polite"></div>
      <header class="hud">
        <div class="hud-box">
          <span class="label">PUNTOS</span>
          <span id="score" class="value">0</span>
        </div>
        <div class="hud-box">
          <span class="label">RÉCORD</span>
          <span id="high-score" class="value">0</span>
        </div>
        <div class="hud-box">
          <span class="label">NIVEL</span>
          <span id="level" class="value">1</span>
        </div>
        <div class="hud-box">
          <span class="label">VIDAS</span>
          <span id="lives" class="value">🟡 ×5</span>
        </div>
      </header>

      <div id="status-strip" class="status-strip" aria-label="Estado de habilidades">
        <div class="dash-meter" title="Espacio / Shift o doble toque para Turbo">
          <span class="strip-label">⚡ TURBO</span>
          <div class="dash-bar-bg">
            <div id="dash-bar-fill" class="dash-bar-fill"></div>
          </div>
          <span id="dash-ready-tag" class="dash-tag">0%</span>
        </div>
        <div id="combo-badge" class="combo-badge">x1</div>
        <div id="power-badges" class="power-badges"></div>
      </div>

      <div id="canvas-container" class="canvas-container">
        <canvas id="gameCanvas" width="456" height="504"></canvas>

        <div id="overlay" class="overlay">
          <div class="menu-card">
            <div class="menu-header">
              <h1 id="overlay-title">PAC-MAN</h1>
              <p id="overlay-subtitle" class="hidden"></p>
            </div>

            <div id="saved-banner" class="saved-banner hidden"></div>

            <div id="menu-config" class="menu-config">
              <div class="mode-selector" role="radiogroup" aria-label="Modo de juego">
                <button type="button" id="mode-normal-btn" class="mode-pill" data-preset="NORMAL">
                  <span class="mode-icon">🟡</span>
                  <span class="mode-name">Normal</span>
                </button>
                <button type="button" id="mode-powers-btn" class="mode-pill active" data-preset="POWERS">
                  <span class="mode-icon">⚡</span>
                  <span class="mode-name">Poderes</span>
                </button>
                <button type="button" id="mode-chaos-btn" class="mode-pill" data-preset="CHAOS">
                  <span class="mode-icon">🔥</span>
                  <span class="mode-name">Caótico</span>
                </button>
              </div>

              <!-- Selector compacto de mapa solo para Modo Caótico -->
              <div id="chaos-map-wrap" class="map-picker hidden" aria-label="Selector de laberinto">
                <button type="button" id="map-prev-btn" class="map-nav-btn" aria-label="Mapa anterior">◀</button>
                <button type="button" id="map-current-btn" class="map-current-display" title="Toca para volver a Aleatorio">
                  <span id="map-swatch" class="map-swatch"></span>
                  <span id="map-current-name" class="map-current-name">🎲 Aleatorio</span>
                </button>
                <button type="button" id="map-next-btn" class="map-nav-btn" aria-label="Mapa siguiente">▶</button>
              </div>
            </div>

            <div class="overlay-actions">
              <button id="continue-btn" class="btn-primary hidden">▶ CONTINUAR PARTIDA</button>
              <button id="menu-btn" class="btn-secondary hidden">🏠 MENÚ PRINCIPAL</button>
              <button id="start-btn" class="btn-primary">▶ JUGAR</button>
            </div>
            <p id="gamepad-hint" class="gamepad-hint hidden" aria-hidden="true"></p>
          </div>
        </div>
      </div>

      <div id="toolbar" class="toolbar" role="group" aria-label="Opciones del juego">
        <button id="pause-btn" class="arcade-btn" title="Tecla P">
          <span class="btn-top">
            <svg
              class="btn-icon"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <rect x="6" y="4" width="4" height="16" rx="1.5" />
              <rect x="14" y="4" width="4" height="16" rx="1.5" />
            </svg>
            <span class="status-dot"></span>
          </span>
          <span class="btn-text">
            <span id="pause-label">Pausar</span>
          </span>
        </button>

        <button id="mute-btn" class="arcade-btn" title="Tecla M">
          <span class="btn-top">
            <svg
              class="btn-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <polygon
                points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"
                fill="currentColor"
              />
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
            </svg>
            <span class="status-dot"></span>
          </span>
          <span class="btn-text">
            <span id="mute-label">Sonido ON</span>
          </span>
        </button>

        <button
          id="control-mode-btn"
          class="arcade-btn"
          title="Cambiar control táctil"
        >
          <span class="btn-top">
            <svg
              class="btn-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="9" />
              <circle cx="12" cy="12" r="3" fill="currentColor" />
            </svg>
            <span class="status-dot"></span>
          </span>
          <span class="btn-text">
            <span id="control-label">Dedo</span>
          </span>
        </button>

        <button
          id="dash-btn"
          class="arcade-btn dash-action-btn"
          title="Activar Turbo (Espacio / Shift)"
        >
          <span class="btn-top">
            <svg
              class="btn-icon"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z" />
            </svg>
            <span class="status-dot"></span>
          </span>
          <span class="btn-text">
            <span id="dash-btn-label">Turbo</span>
          </span>
        </button>
      </div>

      <!-- Joystick táctil para móvil / tablet -->
      <div
        id="joystick-zone"
        class="joystick-zone hidden"
        aria-label="Joystick táctil"
      >
        <div id="joystick-base" class="joystick-base">
          <div id="joystick-knob" class="joystick-knob"></div>
        </div>
      </div>

      <!-- Cruceta direccional táctil para respuestas instantáneas -->
      <div
        id="dpad-zone"
        class="dpad-zone hidden"
        aria-label="Cruceta direccional"
      >
        <div class="dpad-grid">
          <button type="button" class="dpad-btn dpad-up" data-dir="UP" aria-label="Arriba">▲</button>
          <button type="button" class="dpad-btn dpad-left" data-dir="LEFT" aria-label="Izquierda">◀</button>
          <div class="dpad-center"></div>
          <button type="button" class="dpad-btn dpad-right" data-dir="RIGHT" aria-label="Derecha">▶</button>
          <button type="button" class="dpad-btn dpad-down" data-dir="DOWN" aria-label="Abajo">▼</button>
        </div>
      </div>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
