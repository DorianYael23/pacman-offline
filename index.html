<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#090d16" />
    <title>Pac-Man Arcade Offline</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="arcade-wrapper">
      <header class="hud">
        <div class="hud-box">
          <span class="label">PUNTOS</span>
          <span id="score" class="value">0</span>
        </div>
        <div class="hud-box">
          <span class="label">RÉCORD</span>
          <span id="high-score" class="value">0</span>
        </div>
        <div class="hud-box">
          <span class="label">NIVEL</span>
          <span id="level" class="value">1</span>
        </div>
        <div class="hud-box">
          <span class="label">VIDAS</span>
          <span id="lives" class="value">🟡🟡🟡</span>
        </div>
      </header>

      <div class="canvas-container">
        <canvas id="gameCanvas" width="456" height="504"></canvas>

        <div id="overlay" class="overlay">
          <h1 id="overlay-title">PAC-MAN</h1>
          <p id="overlay-subtitle">
            Usa las flechas, WASD o el joystick para moverte
          </p>
          <button id="start-btn" class="btn-primary">JUGAR</button>
        </div>
      </div>

      <div class="toolbar">
        <button id="pause-btn" class="btn-secondary" title="Tecla P">
          Pausar (P)
        </button>
        <button id="mute-btn" class="btn-secondary" title="Tecla M">
          Sonido: ON (M)
        </button>
      </div>

      <!-- Joystick táctil para móvil / tablet -->
      <div class="joystick-zone" aria-label="Joystick táctil">
        <div id="joystick-base" class="joystick-base">
          <div id="joystick-knob" class="joystick-knob"></div>
        </div>
      </div>
    </main>

    <script src="game.js"></script>
  </body>
</html>
